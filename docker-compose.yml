version: '3.8'
services:
  web:
    image: cleaning-ops-web:latest
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '3000:3000'
  api:
    image: cleaning-ops-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - '3001:3001'
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cleaning_ops
    ports:
      - '5432:5432'
