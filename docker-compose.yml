version: '3.9'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cleanops
    volumes:
      - db-data:/var/lib/postgresql/data
  web:
    build: ./apps/web
    container_name: web
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cleanops
  api:
    build: ./apps/api
    container_name: api
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cleanops
volumes:
  db-data:
