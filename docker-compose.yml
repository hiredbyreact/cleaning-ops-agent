version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cleaning
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: ./apps/web
    ports:
      - '3000:3000'
    depends_on:
      - api
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cleaning
  api:
    build: ./apps/api
    ports:
      - '4000:4000'
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cleaning
volumes:
  postgres_data:
